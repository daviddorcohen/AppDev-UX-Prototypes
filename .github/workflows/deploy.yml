name: Deploy to GitHub Pages

on:
  push:
    branches:
      - ux-prototypes
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install and build launcher
        working-directory: launcher
        run: npm install && npm run build

      - name: Install and build MTA prototype
        working-directory: prototypes/mta
        run: npm install && npm run build

      - name: Assemble dist
        run: |
          mkdir -p _site
          cp -R launcher/dist/* _site/
          mkdir -p _site/mta
          cp -R prototypes/mta/dist/* _site/mta/

      - name: Publish static files to branch root (legacy Pages)
        run: |
          cp launcher/dist/index.html .
          cp launcher/dist/404.html .
          rm -rf assets mta
          cp -R launcher/dist/assets .
          mkdir -p mta
          cp -R prototypes/mta/dist/* mta/
          touch .nojekyll

      - name: Commit and push branch root static files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html 404.html .nojekyll assets mta
          git diff --staged --quiet || git commit -m "Publish built static site to branch root [skip ci]"
          git push

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
