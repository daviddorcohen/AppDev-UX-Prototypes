name: "Sandbox Monitor (Backup)"

on:
  schedule:
    - cron: '*/10 * * * *'  # keep-alive + self-heal
    - cron: '0 8 * * *'     # daily token health check
  workflow_dispatch:

env:
  PROTOTYPE_DEPLOYMENT: mta-prototype

jobs:
  keep-alive:
    if: github.event.schedule != '0 8 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Ping prototype
        id: ping
        run: |
          STATUS=$(curl -sk -o /dev/null -w "%{http_code}" "${{ secrets.PROTOTYPE_URL }}" || echo "000")
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "Prototype status: HTTP $STATUS"
          if [ "$STATUS" = "200" ] || [ "$STATUS" = "302" ] || [ "$STATUS" = "403" ]; then
            echo "Prototype is up"
          else
            echo "Prototype is DOWN — will attempt self-heal"
          fi

      - name: Self-heal
        if: steps.ping.outputs.status != '200' && steps.ping.outputs.status != '302' && steps.ping.outputs.status != '403'
        run: |
          curl -sL https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/openshift-client-linux.tar.gz | tar xz
          sudo mv oc /usr/local/bin/
          oc login --token="${{ secrets.OC_TOKEN }}" --server="${{ secrets.OC_SERVER }}" --insecure-skip-tls-verify

          # Ensure deployment has replicas (sandbox idles to 0)
          REPLICAS=$(oc get deployment/${PROTOTYPE_DEPLOYMENT} -o jsonpath='{.spec.replicas}' 2>/dev/null || echo "missing")
          if [ "$REPLICAS" = "missing" ]; then
            echo "Deployment not found — sandbox may have expired. Alerting."
            curl -s -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
              -H 'Content-type: application/json' \
              --data '{"text": ":rotating_light: *[GitHub Actions backup monitor] Deployment missing* — sandbox namespace may have expired. Manual reactivation needed.\n\nWorkflow: <https://github.com/dcohen213/AppDev-UX-Prototypes/actions|View runs>"}'
            exit 1
          fi

          if [ "$REPLICAS" = "0" ]; then
            echo "Deployment scaled to 0 — scaling back up"
            oc scale deployment/${PROTOTYPE_DEPLOYMENT} --replicas=1
          else
            echo "Deployment has $REPLICAS replicas — restarting rollout"
            oc rollout restart deployment/${PROTOTYPE_DEPLOYMENT}
          fi

          oc rollout status deployment/${PROTOTYPE_DEPLOYMENT} --timeout=180s || true

          # Retry loop — pod readiness probe needs time
          for i in 1 2 3 4 5 6; do
            sleep 15
            RECHECK=$(curl -sk -o /dev/null -w "%{http_code}" "${{ secrets.PROTOTYPE_URL }}" || echo "000")
            echo "Attempt $i — HTTP $RECHECK"
            if [ "$RECHECK" = "200" ] || [ "$RECHECK" = "302" ] || [ "$RECHECK" = "403" ]; then
              echo "Self-heal successful"
              exit 0
            fi
          done

          echo "Self-heal FAILED after 6 attempts"
          if [ -n "${{ secrets.SLACK_WEBHOOK_URL }}" ]; then
            curl -s -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
              -H 'Content-type: application/json' \
              --data '{"text": ":rotating_light: *[GitHub Actions backup monitor] Self-heal failed* — site still returning HTTP '"$RECHECK"' after recovery attempt.\n\nOC_TOKEN may be expired or sandbox may need reactivation.\n\nWorkflow: <https://github.com/dcohen213/AppDev-UX-Prototypes/actions|View runs>"}'
          fi
          exit 1

  token-health-check:
    if: github.event.schedule == '0 8 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Verify OC_TOKEN
        run: |
          curl -sL https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/openshift-client-linux.tar.gz | tar xz
          sudo mv oc /usr/local/bin/
          if oc login --token="${{ secrets.OC_TOKEN }}" --server="${{ secrets.OC_SERVER }}" --insecure-skip-tls-verify 2>/dev/null; then
            echo "OC_TOKEN is valid — logged in as $(oc whoami)"
            oc get pods -l app=mta-prototype --no-headers
            echo "Token health check passed"
          else
            echo "OC_TOKEN is EXPIRED or INVALID"
            if [ -n "${{ secrets.SLACK_WEBHOOK_URL }}" ]; then
              curl -s -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
                -H 'Content-type: application/json' \
                --data '{
                  "text": ":rotating_light: *[GitHub Actions backup monitor] OC_TOKEN expired* — self-heal and CI deploys will fail.\n\n*Fix:*\n1. `oc login` to the sandbox\n2. `oc create token ci-deployer --duration=720h`\n3. Update `OC_TOKEN` in both GitLab CI/CD and GitHub repo secrets"
                }'
            fi
            exit 1
          fi
